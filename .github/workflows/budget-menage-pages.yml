# Publication de `budget-menage/` sur GitHub Pages.
#
# Le job `deploy-docs` de `deploy-site.yml` est verrouillé sur le dépôt amont
# (`if: github.repository == 'NousResearch/hermes-agent'`) : il ne s'exécute pas
# ici. Celui-ci publie l'application de budget depuis ce fork, et n'entre jamais
# en concurrence avec lui — il ne se déclenche que sur `budget-menage/**`.
#
# **Pourquoi la branche `gh-pages` et non l'artefact Pages.** Publier par
# artefact suppose que la source du site soit réglée sur « GitHub Actions »,
# et ce réglage demande un droit d'administration qu'un jeton de workflow n'a
# pas : la tentative est morte sur « Resource not accessible by integration ».
# En revanche, GitHub crée le site tout seul quand une branche `gh-pages`
# apparaît. C'est cette voie-là qui a fonctionné, et c'est donc celle que ce
# workflow entretient.
name: Budget ménage — Pages

on:
  push:
    branches:
      - main
      - claude/swiss-household-budget-app-5frk7c
    paths:
      - 'budget-menage/**'
      - '.github/workflows/budget-menage-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours,
# pour ne pas laisser la branche dans un état à moitié poussé.
concurrency:
  group: pages-budget-menage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-menage/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: budget-menage

      - name: Tests
        run: npm test
        working-directory: budget-menage

      - name: Construire
        run: npm run build
        working-directory: budget-menage
        env:
          # Un dépôt de projet est servi sous `/<dépôt>/`, pas à la racine.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Facultatifs : sans eux, la construction retombe sur les
          # identifiants publics inscrits dans `src/lib/supabase.public.js`.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Publier sur gh-pages
        run: |
          set -euo pipefail
          # `.nojekyll` : sans lui, Jekyll ignorerait tout fichier ou dossier
          # commençant par un souligné.
          touch budget-menage/dist/.nojekyll
          cd budget-menage/dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: budget-menage construit depuis ${GITHUB_SHA::7}"
          # La branche ne porte que le résultat de construction : son histoire
          # n'a aucune valeur, on la remplace à chaque fois.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le déploiement de Pages est asynchrone : le push rend la main bien avant
      # que le site ne serve la nouvelle version. Vérifier que l'adresse répond
      # ne prouverait donc rien — elle répondait déjà avant ce workflow.
      #
      # On attend que la page serve **le fichier produit par cette
      # construction-ci**, dont le nom porte une empreinte du contenu. C'est ce
      # qui rend le contrôle capable d'échouer, donc capable de servir.
      - name: Vérifier que le site sert cette construction
        run: |
          set -uo pipefail
          attendu=$(grep -o 'assets/[^"]*\.js' budget-menage/dist/index.html | head -1)
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Attendu : $attendu"

          for essai in $(seq 1 20); do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q "$attendu" /tmp/page.html; then
              echo "✓ $url sert bien cette construction."
              grep -o '<title>[^<]*</title>' /tmp/page.html || true

              # Sans identifiants, l'application s'ouvrirait sur son écran de
              # configuration au lieu d'une connexion. On écrit dans un fichier
              # plutôt que de brancher grep sur un tuyau : `grep -q` sort au
              # premier résultat, curl meurt alors d'un SIGPIPE (erreur 23) et
              # le contrôle se met à échouer pour une raison qui n'est pas la
              # sienne.
              if curl -sS -o /tmp/app.js --max-time 30 "${url}${attendu}"; then
                if grep -q 'supabase\.co' /tmp/app.js; then
                  echo "✓ Le bundle porte une URL de projet Supabase — la connexion est active."
                else
                  echo "::error::Aucune URL Supabase dans le bundle : la connexion serait inactive."
                  exit 1
                fi
                if grep -qE 'sb_secret_[A-Za-z0-9]|"service_role"' /tmp/app.js; then
                  echo "::error title=Clé privée publiée::Le bundle servi contient une clé privée."
                  exit 1
                fi
              else
                echo "::error::Le fichier $attendu n'a pas pu être téléchargé."
                exit 1
              fi
              exit 0
            fi
            echo "essai $essai : $code — cette construction n'est pas encore servie, nouvelle tentative dans 15 s"
            sleep 15
          done
          echo "::error title=Déploiement non servi::$url n'a pas servi $attendu en 5 minutes."
          exit 1
